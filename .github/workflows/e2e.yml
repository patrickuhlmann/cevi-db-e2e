name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Leitet den Playwright-Image-Tag aus der @playwright/test-Version in
  # package.json ab. So gibt es nur EINE Quelle der Wahrheit, die dependabot
  # (npm-Ecosystem) automatisch aktualisiert. dependabot aktualisiert das
  # 'container.image'-Feld in Workflows NICHT selbst.
  setup:
    runs-on: ubuntu-latest
    outputs:
      playwright-image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - name: Playwright-Version ermitteln
        id: version
        run: |
          version="$(sed -n 's/.*"@playwright\/test": *"[\^~>=< ]*\([0-9][0-9.]*\)".*/\1/p' package.json)"
          if [ -z "$version" ]; then
            echo "Konnte @playwright/test-Version nicht aus package.json lesen." >&2
            exit 1
          fi
          echo "image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  e2e:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Offizielles Playwright-Image: passende Browser sind vorinstalliert, kein
    # 'playwright install'-Download noetig (haengt sonst auf dem Runner).
    # Tag wird im 'setup'-Job aus package.json abgeleitet.
    container:
      image: ${{ needs.setup.outputs.playwright-image }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        env:
          HITOBITO_PASSWORD: ${{ secrets.HITOBITO_PASSWORD }}
          HITOBITO_TOTP_SECRET: ${{ secrets.HITOBITO_TOTP_SECRET }}
        run: mkdir -p screenshots && npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 90

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          retention-days: 90

      - name: Upload test results (screenshots/traces)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 90
