name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Browsers cached -> only install system deps (apt). Otherwise full download.
      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright install attempt $attempt timed out or failed, retrying..."
          done
          echo "::error::Playwright install failed after 3 attempts"
          exit 1

      - name: Run E2E tests
        env:
          HITOBITO_PASSWORD: ${{ secrets.HITOBITO_PASSWORD }}
          HITOBITO_TOTP_SECRET: ${{ secrets.HITOBITO_TOTP_SECRET }}
        run: mkdir -p screenshots && npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 90

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          retention-days: 90

      - name: Upload test results (screenshots/traces)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 90
